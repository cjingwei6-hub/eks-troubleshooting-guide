  let currentModule = 'intro';

  function renderSidebar(items, currentId) {
    const list = document.getElementById('sidebarMenuList');
    list.innerHTML = '';

    items.forEach(item => {
      const li = document.createElement('li');
      li.className = 'theme-doc-sidebar-item-link menu__list-item';

      const a = document.createElement('a');
      a.className = 'menu__link' + (item.id === currentId ? ' menu__link--active' : '');
      a.href = 'javascript:void(0)';
      a.onclick = () => loadDoc(item.id);

      let inner = '<div style="display:flex; align-items:center; width:100%; justify-content:space-between;">';
      inner += '<span>' + item.label + '</span>';
      inner += '<div style="display:flex; align-items:center;">';
      if (item.badge) {
        inner += '<span class="badge lab">' + item.badge + '</span>';
      }
      if (item.hasSub) {
        inner += '<span class="menu__caret-custom">></span>';
      }
      inner += '</div></div>';

      a.innerHTML = inner;
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  function loadDoc(docId) {
    const data = docsData[docId] || docsData['intro'];
    document.getElementById('currentBreadcrumb').innerText = data.crumb;
    document.getElementById('pageContent').innerHTML = data.content;

    // 顶部大分类高亮联动
    const mod = data.module || 'intro';
    document.querySelectorAll('.sub-nav-item').forEach(el => el.classList.remove('active'));
    const activeTab = document.getElementById('tab-' + mod);
    if (activeTab) activeTab.classList.add('active');

    // 侧边栏联动
    currentModule = mod;
    const sidebarItems = moduleSidebars[mod] || moduleSidebars['intro'];
    renderSidebar(sidebarItems, docId);

    // 翻页联动
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    if (data.prev && docsData[data.prev]) {
      prevBtn.style.display = 'flex';
      document.getElementById('prevLabel').innerText = data.prevTitle;
      prevBtn.onclick = () => loadDoc(data.prev);
    } else {
      prevBtn.style.display = 'none';
    }

    if (data.next && docsData[data.next]) {
      nextBtn.style.display = 'flex';
      document.getElementById('nextLabel').innerText = data.nextTitle;
      nextBtn.onclick = () => loadDoc(data.next);
    } else {
      nextBtn.style.display = 'none';
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function switchMainTab(modKey) {
    if (docsData[modKey]) {
      loadDoc(modKey);
    } else {
      loadDoc('intro');
    }
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const target = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', target);
  }

  function toggleLang() {
    const t = document.getElementById('langText');
    if (t.innerText.includes('英语')) {
      t.innerText = '文A 中文(简体) ▾';
    } else {
      t.innerText = '文A 英语 ▾';
    }
  }

  function handleSearch(q) {
    q = q.toLowerCase().trim();
    if (!q) return;
    for (const [key, val] of Object.entries(docsData)) {
      if (val.title.toLowerCase().includes(q) || val.content.toLowerCase().includes(q)) {
        loadDoc(key);
        break;
      }
    }
  }

  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      document.getElementById('topSearch').focus();
    }
  });

  window.onload = () => {
    loadDoc('intro');
  };
</script>
